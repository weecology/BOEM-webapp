# Hide Streamlit's automatic page list; utils/nav.py renders a grouped nav instead
[client]
showSidebarNavigation = false

# Scientific / agency theme: credible, readable, restrained
[theme]
primaryColor = "#1b3a57"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a1a1a"
font = "sans serif"